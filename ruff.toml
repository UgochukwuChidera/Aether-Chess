target-version = "py312"
line-length = 100

# Reference-only code kept for the retired Pygame UI, plus notebooks. Not
# imported by the Electron app and not linted, matching pyrightconfig.json.
extend-exclude = ["aether_chess/app.py", "aether_chess/ui", "notebooks"]

[lint]
# E4/E7/E9 + F is ruff's own default set: syntax, pyflakes, and the errors that
# actually break things (undefined names, unused imports, redefinitions).
# I  = import sorting, W = whitespace, B = bugbear (real footguns, not style).
select = ["E4", "E7", "E9", "F", "I", "W", "B"]

[lint.per-file-ignores]
# The bit-twiddling helpers and the evaluation kernel are @numba.njit and are
# written in the compact `if cond: pass else: stmt` form on purpose. Splitting
# those one-liners apart would hurt readability of the most perf-sensitive code
# in the project for no gain.
"aether_chess/engines/mentor_engine.py" = ["E701", "E702"]

# Both of these extend sys.path and set HF_HOME before importing aether_chess,
# because the package is not installed in CI. Imports after that bootstrap are
# deliberate, so E402 is switched off for them rather than annotated line by line.
"backend/analysis.py" = ["E402"]
"backend/chess_engine.py" = ["E402"]

# Tests import the module under test after arranging sys.path, and several
# deliberately shadow names to prove the resolver ignores them.
"tests/*" = ["E402"]

[lint.isort]
known-first-party = ["aether_chess", "backend", "tests"]
