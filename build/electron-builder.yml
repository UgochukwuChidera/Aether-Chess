appId: com.aetherchess.app
productName: Aether Chess
copyright: Copyright © 2025 Aether Chess

directories:
  output: dist/packages
  buildResources: resources

files:
  - dist/electron/**/*
  - dist/renderer/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: resources/config
    to: config
    filter:
      - "**/*.json"
  - from: resources/books
    to: books
    filter:
      - "**/*.bin"
  - from: resources/icons
    to: icons
  # PyInstaller output (set BACKEND_BUILD_DIR in CI)
  - from: build/backend-dist
    to: backend
    filter:
      - "aether_backend*"
      - "aether_backend/**/*"

# macOS
mac:
  category: public.app-category.games
  icon: resources/icons/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: Aether Chess
  backgroundColor: "#0A0A0A"

# Windows
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  allowElevation: true
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico

# Linux
linux:
  icon: resources/icons/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Game

# Auto-update
publish:
  provider: github
  releaseType: release
