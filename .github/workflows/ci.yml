name: CI

on:
  push:
    branches: [main, master, 'copilot/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main, master]

jobs:
  # ── Frontend: lint + build ──────────────────────────────────────────────────
  frontend:
    name: Lint & Build (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint TypeScript/TSX
        run: npm run lint

      - name: Stockfish discovery tests
        # Runs first and on its own so a failure points straight at engine
        # discovery. These tests build their own throwaway UCI stubs, so no
        # Stockfish binary is needed on the runner (engines/ is gitignored).
        # NOTE: the glob (not the directory) is passed to node --test on
        # purpose: Node 22 treats a directory argument as a single failing
        # test instead of discovering files (only newer Node traverses it).
        run: npm run test:electron

      - name: Build renderer + Electron
        run: npm run build

      - name: Type-check renderer
        run: npm run typecheck:renderer

      - name: Renderer tests
        run: npm run test:renderer

      - name: Hermetic e2e (fixture backend)
        # Electron needs an X display; GitHub Linux runners have none, so run
        # under a virtual display (xvfb is preinstalled on ubuntu-latest).
        # Hermetic tier: fixture backend, no Python install needed.
        run: xvfb-run -a npm run test:e2e

  # ── Backend: Python unit tests ──────────────────────────────────────────────
  backend:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install dev tooling
        # ruff (linter) and pyright (type checker) are dev-only, so they live in
        # requirements-dev.txt rather than the runtime requirements.
        run: pip install -r requirements-dev.txt

      - name: Build C++ kernel (P4-T06)
        # gcc is preinstalled on ubuntu-latest and setup-python ships the
        # Python headers, so the kernel builds on the runner with no extra
        # toolchain step. Run setup.py directly (this job has no Node, so
        # `npm run build:cpp` -- which just cds into cpp_engine/ first --
        # is unavailable here). The .so is gitignored and rebuilt fresh so
        # the Tier-3 kernel tests RUN in CI instead of skipping. No
        # Windows/MSVC step: this workflow has no Windows jobs or
        # patterns (ubuntu-latest only), so it is not applicable here.
        run: |
          pip install setuptools
          cd cpp_engine && python setup.py build_ext --inplace
          cd ..
          python -c "import cpp_engine as k; assert k._has_cpp, k.get_info(); print(k.get_info())"

      - name: Note — venv/ not required on runner
        # venv/ is a local-dev convenience only; the runner uses system python
        # with pip installs from requirements.txt / requirements-dev.txt above.
        run: |
          echo "venv/ is not required on the runner: system python + pip from requirements files is used."

      - name: Lint Python (ruff)
        run: ruff check .

      - name: Type-check Python (pyright)
        run: pyright

      - name: Verify no engine binaries are tracked
        # engines/ is gitignored, but a stray `git add -f` of a 100 MB+ binary
        # would be expensive to undo and is easy to miss in review.
        run: |
          tracked=$(git ls-files engines/ | grep -v '\.gitkeep$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Engine binaries must not be committed:"
            echo "$tracked"
            exit 1
          fi

      - name: Install pinned Stockfish build
        # No Git LFS, no repo weight: pull the official build once per run.
        # Version pinned by release tag in one place (below); bump the tag
        # deliberately, never floating. Gives the resolver + auto-routing
        # tests a REAL subject (option negotiation, real info-line parsing,
        # version discovery) alongside the deterministic stubs. engines/
        # stays gitignored by design -- this lands in the runner temp dir.
        run: |
          SF_TAG="sf_17"
          curl -sL --max-time 120 -o "${RUNNER_TEMP}/stockfish.tar" "https://github.com/official-stockfish/Stockfish/releases/download/${SF_TAG}/stockfish-ubuntu-x86-64.tar"
          mkdir -p "${RUNNER_TEMP}/stockfish-bin"
          tar -xf "${RUNNER_TEMP}/stockfish.tar" -C "${RUNNER_TEMP}/stockfish-bin"
          SF_BIN=$(find "${RUNNER_TEMP}/stockfish-bin" -name "stockfish*" -type f | head -1)
          chmod +x "$SF_BIN"
          printf 'uci\nquit\n' | "$SF_BIN" | grep -q "uciok" && echo "Stockfish smoke OK: $SF_BIN"
          echo "$(dirname "$SF_BIN")" >> "$GITHUB_PATH"

      - name: Stockfish resolver tests
        env:
          # runner context is allowed in step env (not job env).
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
        # Runs first and on its own so a failure points straight at engine
        # discovery. These tests build their own throwaway UCI stubs, so no
        # Stockfish binary is needed on the runner (engines/ is gitignored).
        run: python -m unittest tests.test_engine_registry -v

      - name: Run unit tests
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
        run: python -m unittest discover -s tests -v
